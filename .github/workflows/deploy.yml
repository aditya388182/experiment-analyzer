# Deploy on push to main: build and push images to GHCR, helm upgrade on the EC2 k3s box over SSH, smoke test.
# NOT RUN YET (Phase 7 needs the owner's AWS box, domain and GitHub secrets: BLOCKERS.md B3-B6).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS   access to the box
#   DJANGO_SECRET_KEY, POSTGRES_PASSWORD, RABBITMQ_PASSWORD  become the Kubernetes Secret (never in values.yaml)
# Repository variables:
#   APP_HOST (p3.<domain>), S3_BUCKET, AWS_REGION
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lower-case registry path (GHCR requires it)
        run: echo "IMAGE=$(echo "${REGISTRY}/experiment-analyzer-${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ssh setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: copy the chart and the remote script to the box
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          tar -czf chart.tgz -C deploy/helm experiment-analyzer
          scp -i ~/.ssh/id_deploy chart.tgz "$TARGET:/tmp/experiment-analyzer-chart.tgz"
          scp -i ~/.ssh/id_deploy deploy/box/remote-deploy.sh "$TARGET:/tmp/experiment-analyzer-deploy.sh"
      - name: create the Secret and helm upgrade (on the box)
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          APP_HOST: ${{ vars.APP_HOST }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          # Secrets go over stdin, one per line, never on a command line (where `ps` could show them).
          printf '%s\n%s\n%s\n' "$DJANGO_SECRET_KEY" "$POSTGRES_PASSWORD" "$RABBITMQ_PASSWORD" | \
            ssh -i ~/.ssh/id_deploy "$TARGET" \
              "sudo APP_HOST='$APP_HOST' S3_BUCKET='$S3_BUCKET' AWS_REGION='$AWS_REGION' SHA='${{ github.sha }}' \
               OWNER='${{ github.repository_owner }}' CHART_TGZ=/tmp/experiment-analyzer-chart.tgz \
               bash /tmp/experiment-analyzer-deploy.sh"

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: TLS check
        run: curl -fsSI "https://${{ vars.APP_HOST }}" | head -5
      - name: smoke test (health + sample analysis)
        run: |
          python3 scripts/smoke.py "https://${{ vars.APP_HOST }}" \
            --out results/deploy_smoke.json --command "deploy.yml smoke job (${{ github.sha }})"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deploy_smoke
          path: results/deploy_smoke.json
