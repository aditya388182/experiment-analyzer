[project]
name = "abkit"
version = "0.1.0"
description = "Experiment statistics (Welch, SRM, Holm, CUPED, power) for experiment-analyzer"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.14",
    "statsmodels==0.15.0",
    "pandas==3.0.6",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
