[project]
name = "experiment-analyzer-backend"
version = "0.1.0"
description = "Django REST Framework API and Celery worker for experiment-analyzer"
requires-python = "==3.12.*"
dependencies = [
    "abkit",
    "django==5.2.19",
    "djangorestframework==3.18.3",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.6",
    "celery==5.6.3",
    "kombu==5.6.2",
    "amqp==5.4.1",
    "boto3==1.43.123",
    "duckdb==1.5.6",
    "numpy==2.5.4",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.14",
    "moto[server,s3]==5.2.5",
    "ruff==0.17.3",
    "requests==2.34.2",
]

[tool.uv]
package = false

[tool.uv.sources]
abkit = { path = "../abkit", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["analyzer/tests"]
addopts = "-ra"
markers = ["integration: needs a real RabbitMQ broker and Celery worker (make test-integration)"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["analyzer/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings_test.py" = ["F403", "F405", "E402"]
