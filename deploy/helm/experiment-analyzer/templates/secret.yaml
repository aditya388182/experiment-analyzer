{{- if .Values.secrets.create }}
{{- /* Local clusters only. Random values on first install, reused on upgrade (lookup), kept on uninstall so the
       PVC's database password still matches. Production uses secrets.existingSecret created by deploy.yml. */ -}}
{{- $name := include "ea.fullname" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $old }}{{- $data = $old.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ea.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  DJANGO_SECRET_KEY: {{ get $data "DJANGO_SECRET_KEY" | default (randAlphaNum 50 | b64enc) }}
  POSTGRES_PASSWORD: {{ get $data "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  RABBITMQ_PASSWORD: {{ get $data "RABBITMQ_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
