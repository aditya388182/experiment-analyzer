{{- $c := dict "root" . "component" "web" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ea.fullname" . }}-web
  labels: {{- include "ea.labels" . | nindent 4 }}
spec:
  selector: {{- include "ea.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ea.fullname" . }}-web
  labels: {{- include "ea.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "ea.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ea.selector" $c | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ea.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "ea.podSecurity" (dict "uid" 101 "gid" 101) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "ea.image" (dict "root" . "name" .Values.image.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: {{- include "ea.containerSecurity" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # nginx-unprivileged keeps its pid and temp files in /tmp
      volumes:
        - { name: tmp, emptyDir: {} }
