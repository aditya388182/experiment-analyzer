# The migrate Job's settings, as a hook resource created just before the Job (weight -5). See ea.configData.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ea.fullname" . }}-migrate
  labels: {{- include "ea.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- include "ea.configData" . | nindent 2 }}
