# Dev (Compose) only: the same SPA server, plus /api proxied to the api container so the browser uses one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;   # the API never receives files; uploads go straight to S3
    }

    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
