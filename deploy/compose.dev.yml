# Dev stack: `make dev` (from the repo root). Values come from ../.env (copy .env.example).
# All ports are published on 127.0.0.1 only. On a remote box, reach them with an SSH tunnel.
name: experiment-analyzer

services:
  postgres:
    image: postgres:16.16-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-analyzer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me-dev-only}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  moto:
    image: motoserver/moto:5.2.5
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
